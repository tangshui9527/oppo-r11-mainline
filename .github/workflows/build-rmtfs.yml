name: build-rmtfs

on:
  push:
    paths:
      - ".github/workflows/build-rmtfs.yml"
  workflow_dispatch:

jobs:
  rmtfs:
    runs-on: ubuntu-latest
    steps:
      - name: Install aarch64 gcc
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gcc-aarch64-linux-gnu

      - name: Build and Patch rmtfs
        run: |
          git clone --depth 1 https://github.com/andersson/qrtr.git
          git clone --depth 1 https://github.com/linux-msm/rmtfs.git

          cd rmtfs
          # 1. Add Oppo partitions
          sed -i '/\/oem\/nvbk\/static/i \	{ "/boot/modem_fsg_oem_1", "modem_fsg_oem_1", "oppostanvbk" },\n\t{ "/boot/modem_fsg_oem_2", "modem_fsg_oem_2", "oppodycnvbk" },' storage.c

          # 2. Add relative address support in sharedmem.c
          sed -i '/static void \*rmtfs_mem_ptr/,/{/{n;s/.*/\tif (rmem \&\& phys_address < rmem->size) phys_address += rmem->address;/}' sharedmem.c
          sed -i '/offset = phys_address - rmem->address;/i \	if (phys_address < rmem->size) phys_address += rmem->address;' sharedmem.c

          git diff storage.c sharedmem.c

          # 3. Direct compile with -DANDROID (uses /sys/class/rmtfs directly, zero libudev dependency!)
          aarch64-linux-gnu-gcc -O2 -Wall -DANDROID \
            -I../qrtr/lib \
            rmtfs.c qmi_rmtfs.c rproc.c sharedmem.c storage.c util.c \
            ../qrtr/lib/qrtr.c ../qrtr/lib/qmi.c \
            -o rmtfs

          aarch64-linux-gnu-strip rmtfs
          file rmtfs
          ls -lh rmtfs
          mkdir -p ../dist
          cp rmtfs ../dist/

      - name: Upload rmtfs artifact
        uses: actions/upload-artifact@v4
        with:
          name: rmtfs-aarch64
          path: dist/rmtfs
